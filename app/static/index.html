<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>农民工法律维权平台 · 智能法律咨询</title>
<style>
/* ==========================================================
   农民工法律维权平台 · 智能法律咨询
   政务法律援助视觉系统
   主色: 深森林绿  辅色: 暖米白/暗金  文字: 墨色
   风格: 稳重 · 朴实 · 正式 · 投屏友好
   ========================================================== */
:root {
  /* 深绿主色阶 */
  --green-950: #0B2E1D;
  --green-900: #0E3B26;
  --green-800: #11492F;
  --green-700: #14684B;
  --green-600: #1B7A57;
  --green-500: #2E8B64;
  --green-100: #E8F2EC;
  --green-50:  #F4F8F5;

  /* 暖米白背景与墨色文字 */
  --bg:        #F6F5F0;
  --bg-panel:  #FAF9F5;
  --ink:       #2E2C26;
  --ink-soft:  #6B675C;
  --ink-faint: #9B978A;
  --line:      #E2DED1;
  --line-soft: #EDE9DE;

  /* 暗金点缀（克制使用） */
  --gold:      #9A7B3F;
  --gold-soft: #C9B98D;

  /* 语义色（政务化，无荧光） */
  --warn-bg:    #FBF3E7;
  --warn-line:  #D9BE92;
  --warn-ink:   #7A5A1C;
  --alert-bg:   #FBEFEF;
  --alert-line: #D9A8A8;
  --alert-ink:  #8B2E2E;

  /* 字体 */
  --font-serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --font-sans:  "Microsoft YaHei", "PingFang SC", "Source Han Sans SC", "WenQuanYi Micro Hei", sans-serif;

  --radius: 10px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* ---------- 顶栏：政务深绿 ---------- */
header {
  background: var(--green-900);
  color: #F2EFE4;
  flex: 0 0 auto;
  position: relative;
}
/* 顶栏底部暗金细线，公文感 */
header::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--gold) 0%, var(--gold-soft) 50%, var(--gold) 100%);
}
.header-inner {
  max-width: 1060px;
  margin: 0 auto;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.badge {
  width: 46px; height: 46px;
  border: 1px solid var(--gold-soft);
  border-radius: 10px;
  background: rgba(255,255,255,.06);
  display: flex; align-items: center; justify-content: center;
  flex: 0 0 auto;
}
.badge svg { width: 28px; height: 28px; }
.brand h1 {
  font-family: var(--font-serif);
  font-size: 21px;
  font-weight: 600;
  letter-spacing: .06em;
  color: #F6F2E4;
}
.brand p {
  font-size: 12.5px;
  color: #B9CDBF;
  margin-top: 4px;
  letter-spacing: .08em;
}
.header-right {
  margin-left: auto;
  display: flex; align-items: center; gap: 12px;
}
.mode-tag {
  font-size: 12.5px;
  padding: 5px 14px;
  border-radius: 999px;
  border: 1px solid rgba(201,185,141,.55);
  color: #E4DCC2;
  background: rgba(255,255,255,.05);
  letter-spacing: .04em;
  white-space: nowrap;
}
.mode-tag .dot {
  display: inline-block;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--gold-soft);
  margin-right: 7px;
  vertical-align: 1px;
}

/* ---------- 模式横幅 ---------- */
.notice {
  flex: 0 0 auto;
  background: var(--warn-bg);
  border-bottom: 1px solid var(--warn-line);
  color: var(--warn-ink);
  font-size: 13px;
  line-height: 1.7;
  padding: 9px 24px;
  text-align: center;
}

/* ---------- 对话区 ---------- */
#chat {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 26px 20px 12px;
  scroll-behavior: smooth;
}
.chat-inner {
  max-width: 920px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
}

.msg {
  display: flex;
  margin-bottom: 18px;
  animation: msg-in .28s ease-out both;
}
@keyframes msg-in {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.msg .avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-serif);
  font-size: 16px;
  margin-top: 2px;
}
/* 用户消息：深绿实底，右对齐 */
.msg.user { flex-direction: row-reverse; }
.msg.user .avatar {
  background: var(--green-800);
  color: #F2EFE4;
  margin-left: 10px;
}
.msg.user .bubble {
  background: var(--green-700);
  color: #FDFCF7;
  border-radius: var(--radius);
  border-bottom-right-radius: 3px;
}
/* AI 消息：白底墨字，左对齐 */
.msg.ai .avatar {
  background: var(--green-100);
  color: var(--green-800);
  margin-right: 10px;
}
.msg.ai .bubble {
  background: #FFFFFF;
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  border-bottom-left-radius: 3px;
}
.bubble {
  max-width: 78%;
  padding: 13px 17px;
  font-size: 15.5px;
  line-height: 1.8;
  white-space: pre-wrap;
  word-break: break-word;
}
.bubble strong { font-weight: 600; }
.msg-time {
  font-size: 11px;
  color: var(--ink-faint);
  margin: 0 12px;
  align-self: center;
  flex: 0 0 auto;
  white-space: nowrap;
}
.msg.user .msg-time { margin-left: 0; }

/* 来源引用卡片 */
.cites {
  margin-top: 12px;
  border-top: 1px dashed var(--line);
  padding-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.cites-label {
  font-size: 12px;
  color: var(--ink-soft);
  letter-spacing: .06em;
  margin-bottom: 2px;
}
.cite {
  background: var(--green-50);
  border: 1px solid var(--line);
  border-left: 4px solid var(--green-600);
  border-radius: 8px;
  padding: 9px 13px;
  font-size: 13px;
}
.cite .doc {
  font-weight: 600;
  color: var(--green-800);
  font-size: 13.5px;
}
.cite .meta {
  color: var(--ink-soft);
  font-size: 12px;
  margin: 4px 0 6px;
}
.cite .snippet { color: #3F3B32; line-height: 1.7; }
.tag {
  display: inline-block;
  font-size: 11px;
  padding: 1px 9px;
  border-radius: 10px;
  background: var(--green-100);
  color: var(--green-800);
  margin-left: 8px;
  vertical-align: 1px;
  border: 1px solid #C6DCCB;
}
.tag.repealed { background: var(--alert-bg); color: var(--alert-ink); border-color: var(--alert-line); }

/* 范围外提示 */
.outofscope {
  background: var(--alert-bg);
  border: 1px solid var(--alert-line);
  color: var(--alert-ink);
  border-radius: 8px;
  padding: 11px 14px;
  font-size: 14.5px;
  line-height: 1.8;
  margin-bottom: 10px;
}

.disclaimer {
  color: var(--ink-faint);
  font-size: 11.5px;
  line-height: 1.6;
  margin-top: 9px;
}

/* ---------- 示例问题 ---------- */
.chips {
  flex: 0 0 auto;
  max-width: 920px;
  margin: 0 auto;
  width: 100%;
  padding: 0 20px 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}
.chip {
  background: #FFFFFF;
  border: 1px solid var(--line);
  color: var(--green-800);
  border-radius: 999px;
  padding: 7px 16px;
  font-size: 13.5px;
  cursor: pointer;
  font-family: inherit;
  transition: all .18s ease-out;
}
.chip:hover {
  border-color: var(--green-600);
  background: var(--green-50);
}

/* ---------- 输入区 ---------- */
footer {
  flex: 0 0 auto;
  background: var(--bg-panel);
  border-top: 1px solid var(--line);
  padding: 14px 20px 16px;
}
.footer-inner {
  max-width: 920px;
  margin: 0 auto;
  display: flex;
  gap: 12px;
  align-items: stretch;
}
#input {
  flex: 1;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 16px;
  font-size: 15.5px;
  font-family: inherit;
  color: var(--ink);
  background: #FFFFFF;
  outline: none;
  transition: border-color .18s ease-out, box-shadow .18s ease-out;
}
#input::placeholder { color: var(--ink-faint); }
#input:focus {
  border-color: var(--green-600);
  box-shadow: 0 0 0 3px rgba(20,104,75,.14);
}
#send {
  border: none;
  border-radius: var(--radius);
  background: var(--green-700);
  color: #FDFCF7;
  font-size: 15px;
  font-family: var(--font-serif);
  letter-spacing: .2em;
  padding: 0 30px;
  cursor: pointer;
  transition: background .18s ease-out;
}
#send:hover { background: var(--green-800); }
#send:disabled { opacity: .55; cursor: not-allowed; }

.foot-line {
  max-width: 920px;
  margin: 10px auto 0;
  text-align: center;
  font-size: 12px;
  color: var(--ink-faint);
  letter-spacing: .1em;
}
.foot-line .sep { margin: 0 10px; color: var(--gold-soft); }

/* 滚动条 */
#chat::-webkit-scrollbar { width: 8px; }
#chat::-webkit-scrollbar-thumb { background: #CFCAB8; border-radius: 4px; }
#chat::-webkit-scrollbar-track { background: transparent; }

/* 投屏/窄屏适配 */
@media (max-width: 720px) {
  .brand h1 { font-size: 17px; }
  .header-right .mode-tag { display: none; }
  .msg-time { display: none; }
  .bubble { max-width: 88%; font-size: 15px; }
  #send { padding: 0 18px; letter-spacing: .1em; }
}
</style>
</head>
<body>

<!-- 天平图标 -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-scale" viewBox="0 0 24 24">
    <path d="M12 3v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M5 6h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M5 6l-2.5 8a3 3 0 0 0 5 0L5 6z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
    <path d="M19 6l-2.5 8a3 3 0 0 0 5 0L19 6z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
    <path d="M12 9a3.2 3.2 0 0 1 3.2 3.2c0 1.8-1.4 3.3-3.2 3.3s-3.2-1.5-3.2-3.3A3.2 3.2 0 0 1 12 9z" stroke="currentColor" stroke-width="1.6" fill="none"/>
    <path d="M12 16v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </symbol>
</svg>

<header>
  <div class="header-inner">
    <div class="badge">
      <svg><use href="#i-scale"/></svg>
    </div>
    <div class="brand">
      <h1>农民工法律维权平台</h1>
      <p>智 能 法 律 咨 询 助 手</p>
    </div>
    <div class="header-right">
      <span class="mode-tag" id="modeTag"><span class="dot"></span><span id="modeText">智能问答模式</span></span>
    </div>
  </div>
</header>

<div class="notice" id="notice" style="display:none"></div>

<div id="chat">
  <div class="chat-inner" id="chatInner"></div>
</div>

<div class="chips" id="chips"></div>

<footer>
  <div class="footer-inner">
    <input id="input" placeholder="请输入您的问题，例如：老板拖欠我三个月工资，怎么办？" autocomplete="off" aria-label="请输入法律问题">
    <button id="send">发 送</button>
  </div>
  <div class="foot-line">
    依法维权 · 诚实劳动
    <span class="sep">◆</span>
    12348 法律援助热线 · 12333 人社服务热线
  </div>
</footer>

<script>
/* ============ 功能逻辑（保持不变） ============ */
const EXAMPLES = [
  "老板拖欠我三个月工资，怎么办？",
  "没签劳动合同，能要双倍工资吗？",
  "申请劳动仲裁的时效是多久？",
  "代写劳动法律文书",
];
const chipsBox = document.getElementById("chips");
const DOC_CMD = "代写劳动法律文书";
/* 文书代写多轮收集：前端为文书流程维护对话记忆（拼接历史随请求发送），
   普通问答不携带历史；点击普通快捷问题即退出文书流程。 */
let docFlow = { active: false, history: [] };
EXAMPLES.forEach(t => {
  const c = document.createElement("button");
  c.type = "button";
  c.className = "chip";
  c.textContent = t;
  c.onclick = () => {
    if (t !== DOC_CMD) docFlow = { active: false, history: [] };
    ask(t);
  };
  chipsBox.appendChild(c);
});

const chatInner = document.getElementById("chatInner");
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const notice = document.getElementById("notice");
const modeTag = document.getElementById("modeTag");
const modeText = document.getElementById("modeText");

/* 欢迎引导语（空状态） */
function welcome() {
  const m = document.createElement("div");
  m.className = "msg ai";
  m.innerHTML =
    '<div class="avatar">法</div>' +
    '<div class="bubble">您好，我是法律援助智能咨询助手。\n' +
    '您可以就<b>工资拖欠、未签劳动合同、工伤赔偿、社保缴纳、劳动仲裁</b>等问题向我咨询，' +
    '我的回答会引用现行有效的法律条文，并标注出处。\n\n' +
    '请直接描述您遇到的情况，或点击下方示例问题开始咨询。</div>';
  chatInner.appendChild(m);
  chat.scrollTop = chat.scrollHeight;
}

function nowTime() {
  const d = new Date();
  return d.getHours().toString().padStart(2, "0") + ":" +
         d.getMinutes().toString().padStart(2, "0");
}

function addMsg(text, role) {
  const m = document.createElement("div");
  m.className = "msg " + role;
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "问" : "法";
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  const t = document.createElement("span");
  t.className = "msg-time";
  t.textContent = nowTime();
  if (role === "user") {
    m.appendChild(avatar); m.appendChild(b); m.appendChild(t);
  } else {
    m.appendChild(avatar); m.appendChild(b);
  }
  chatInner.appendChild(m);
  chat.scrollTop = chat.scrollHeight;
  return m;
}

function statusTag(s) {
  if (s === "repealed") return '<span class="tag repealed">已废止</span>';
  if (s === "revised") return '<span class="tag">已修订</span>';
  return '<span class="tag">现行有效</span>';
}

function addCites(cites) {
  const box = document.createElement("div");
  box.className = "cites";
  const label = document.createElement("div");
  label.className = "cites-label";
  label.textContent = "—— 法律依据 ——";
  box.appendChild(label);
  cites.forEach(c => {
    const d = document.createElement("div");
    d.className = "cite";
    d.innerHTML =
      '<div class="doc">《' + esc(c.document_name) + '》' + esc(c.article_no) + statusTag(c.status) + '</div>' +
      '<div class="meta">生效 ' + esc(c.enacted_date || "待核验") +
      (c.revision_date ? " · 最近修订 " + esc(c.revision_date) : "") + '</div>' +
      '<div class="snippet">' + esc(c.snippet) + '</div>';
    box.appendChild(d);
  });
  const last = chatInner.lastElementChild;
  if (last) {
    const bubble = last.querySelector(".bubble");
    if (bubble) bubble.appendChild(box);
  }
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* 文书流程历史：只累积用户消息（即用户提供的信息本体），助手追问不携带；
   超长时从最早的轮次开始裁剪，保证不超接口 2000 字上限 */
function buildDocPayload(question) {
  let userMsgs = docFlow.history.filter(h => h.indexOf("用户：") === 0);
  let compacted = userMsgs.slice(-14).map(h => h.length > 250 ? h.slice(0, 250) + "…" : h);
  let payload = "【用户已提供的信息】\n" + compacted.join("\n") + "\n\n【用户当前输入】\n" + question;
  while (payload.length > 1950 && compacted.length > 1) {
    compacted = compacted.slice(1);
    payload = "【用户已提供的信息】\n" + compacted.join("\n") + "\n\n【用户当前输入】\n" + question;
  }
  if (payload.length > 1950) {
    payload = "【用户当前输入】\n" + question.slice(0, 1500);
  }
  return payload;
}

async function ask(question) {
  question = (question || input.value).trim();
  if (!question) return;
  input.value = "";
  if (question === DOC_CMD) docFlow = { active: true, history: [] };

  /* 文书流程中：把最近几轮对话拼入请求（截断压缩，保证不超接口 2000 字上限），
     让智能体持续掌握已收集信息 */
  let payloadQuestion = question;
  if (docFlow.active && docFlow.history.length) {
    payloadQuestion = buildDocPayload(question);
  }

  addMsg(question, "user");
  const typing = addMsg("正在检索法律条文，请稍候…", "ai");

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: payloadQuestion }),
    });
    const d = await resp.json();
    docFlow.history.push("用户：" + question);
    docFlow.history.push("助手：" + d.answer);

    typing.querySelector(".bubble").textContent = "";
    if (!d.in_scope) {
      const warn = document.createElement("div");
      warn.className = "outofscope";
      warn.innerHTML = "该问题超出本知识库收录范围，本助手不会编造法律内容。建议拨打 <b>12348</b> 法律援助热线或 <b>12333</b> 人社服务热线咨询。";
      typing.querySelector(".bubble").appendChild(warn);
    }
    typing.querySelector(".bubble").textContent = d.answer;
    if (d.citations && d.citations.length) addCites(d.citations);
    const disc = document.createElement("div");
    disc.className = "disclaimer";
    disc.textContent = d.disclaimer || "";
    typing.appendChild(disc);
  } catch (e) {
    typing.querySelector(".bubble").textContent = "请求失败，请确认服务已启动（start.bat 或 uvicorn app.main:app）。";
  }
}

sendBtn.onclick = () => ask();
input.onkeydown = e => { if (e.key === "Enter") ask(); };

(async () => {
  try {
    const h = await (await fetch("/api/health")).json();
    if (h.degraded_mode) {
      notice.style.display = "block";
      notice.textContent = "当前未配置大模型密钥，智能体以“条文直出”模式工作（回答直接展示检索到的法条原文）。通过 start.bat 启动即可升级为智能问答模式。";
      modeText.textContent = "条文直出模式";
    } else {
      modeText.textContent = "智能问答模式";
    }
  } catch (e) { /* 服务未启动时忽略 */ }
})();

welcome();
</script>
</body>
</html>
